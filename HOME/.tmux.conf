# ==============================================================================
# tmux Configuration - Emacs Compatible
# ==============================================================================
# C-x prefix (Emacs style)
#
# ┌──────────┬───────────────────┬──────────────────────────┐
# │ Key      │ Action            │ Description              │
# ├──────────┼───────────────────┼──────────────────────────┤
# │ C-x 2    │ split-window -v   │ Horizontal split (below) │
# │ C-x 3    │ split-window -h   │ Vertical split (right)   │
# │ C-x 0    │ kill-pane         │ Close current pane       │
# │ C-x 1    │ resize-pane -Z    │ Zoom toggle              │
# │ C-x o    │ select-pane next  │ Next pane                │
# │ C-x ←↑↓→ │ select-pane       │ Navigate by direction    │
# │ C-x n    │ select-pane prev  │ Previous pane            │
# │ C-x d    │ detach            │ Detach session           │
# │ C-x 4    │ select-layout -E  │ Balance panes equally    │
# │ C-x 6    │ display-popup     │ Floating shell (center)  │
# │ C-x C-x  │ send-prefix       │ Send C-x to app         │
# └──────────┴───────────────────┴──────────────────────────┘

# ------------------------------------------------------------------------------
# Prefix
# ------------------------------------------------------------------------------

set -g prefix C-x
unbind C-b
bind C-x send-prefix

# ------------------------------------------------------------------------------
# Pane Operations
# ------------------------------------------------------------------------------

# Split (keep current path)
bind 2 split-window -v -c "#{pane_current_path}"
bind 3 split-window -h -c "#{pane_current_path}"
bind 0 kill-pane
bind 1 resize-pane -Z

# Navigation
bind o select-pane -t :.+
bind n select-pane -t :.-
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ------------------------------------------------------------------------------
# Floating Popup
# ------------------------------------------------------------------------------

bind 4 select-layout -E
bind 6 display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# ------------------------------------------------------------------------------
# Session
# ------------------------------------------------------------------------------

bind d detach-client

# Cancel (Emacs C-g)
bind C-g display-message "Cancelled"

# ------------------------------------------------------------------------------
# Terminal
# ------------------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",ghostty:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -sg escape-time 10
set -g mouse on
set -s set-clipboard on
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode M-n send-keys -X page-down
bind -T copy-mode M-p send-keys -X page-up
set -g history-limit 50000
set -g focus-events on

# ------------------------------------------------------------------------------
# Window / Pane
# ------------------------------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename on
set -g set-titles on
setw -g automatic-rename on
set -g pane-border-lines double
set -g pane-border-status top
set -g pane-border-format " #{pane_current_command}: #{b:pane_current_path} "

# ------------------------------------------------------------------------------
# Colors (Tokyo Night)
# ------------------------------------------------------------------------------

# Pane borders
set -g pane-border-style "fg=#8a5c3a"
set -g pane-active-border-style "fg=#ff9e64"

# Popup (C-x 6)
set -g popup-style "bg=#1a1b26"
set -g popup-border-style "fg=#565f89"
set -g popup-border-lines rounded

# Messages / Copy mode
set -g message-style "bg=#1a1b26,fg=#7aa2f7"
set -g mode-style "bg=#283457,fg=#c0caf5"

# ------------------------------------------------------------------------------
# Status Bar (minimal)
# ------------------------------------------------------------------------------

# NOTE: tmux-continuum の自動保存は status-right の評価で動くため off にしない
set -g status on
set -g status-interval 15
set -g status-justify left

# Tokyo Night (バーとして視認できる控えめパネル)
set -g status-style "bg=#24283b,fg=#787c99"
# 左端: セッション名 [gitブランチ]
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#9ece6a,bg=#24283b] #(git -C \"#{pane_current_path}\" branch --show-current 2>/dev/null) #[fg=#3b4261]│ "
set -g status-left-length 50

# 右端: [プレフィックス押下] [ズーム中] [自動保存] │ 日時
set -g status-right-length 50
set -g status-right "#[fg=#1a1b26,bg=#e0af68,bold]#{?client_prefix, C-x ,}#[default]#[fg=#ff9e64]#{?window_zoomed_flag, [Z],}#[fg=#565f89] ⏱#{continuum_status} #[fg=#3b4261]│#[fg=#a9b1d6] %m/%d(%a) %H:%M "

# 非アクティブウィンドウの出力を色+「!」で通知
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-format "#[fg=#a9b1d6] #I:#{b:pane_current_path}#{?window_activity_flag,#[fg=#7aa2f7]!,} "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#ff9e64,bold] #I:#{b:pane_current_path} "
setw -g window-status-activity-style "fg=#7aa2f7"

# ------------------------------------------------------------------------------
# Plugins (TPM)
# ------------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session restore
set -g @continuum-restore 'on'
# NOTE: 未設定でも15分で動くが、未設定だと #{continuum_status} が "off" 表示になるため明示
set -g @continuum-save-interval '15'

# Initialize TPM (must be at the very end)
run '~/.tmux/plugins/tpm/tpm'
